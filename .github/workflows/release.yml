name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "Building package version ${package_version} for tag v${tag_version}."
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run --testTimeout=15000

      - name: Build (host + client)
        run: pnpm build

      - name: Pack tgz
        run: npm pack

      - name: Verify tarball entry files
        shell: bash
        run: |
          tgz="$(ls -1 ./*.tgz | head -1)"
          echo "tarball: ${tgz}"
          missing=0
          for entry in package/lib/index.js package/lib/client.js package/cordis.patch.yml; do
            if ! tar -tzf "${tgz}" | grep -qx "${entry}"; then
              echo "::error::tarball missing ${entry}"
              missing=1
            fi
          done
          if [ "${missing}" != "0" ]; then
            exit 1
          fi

      # npm 发布暂未启用：需要先确定小写包名或 scope（npm 不接受大写包名），
      # 并在仓库配置 NPM_TOKEN 后再追加 publish 步骤。
      - name: GitHub Release (attach tgz)
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
